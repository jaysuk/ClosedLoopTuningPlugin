name: Release

# Builds the installable plugin ZIP against DuetWebControl's source and creates a GitHub Release for
# it. Cut a release with:
#
#   npm run release -- 1.0.1 --push      # bumps plugin.json+package.json, commits, tags, pushes
#
# Title (a pun from scripts/release-titles.txt) and notes (Conventional-Commit changelog from the
# shared generator in the runtime repo) are generated automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build the DWC 3.7 package against
        default: v3.7-dev
      dwc36-ref:
        description: DuetWebControl branch/tag/sha to build the DWC 3.6 package against (only used once src/ui36 exists)
        default: v3.6-dev

permissions:
  contents: write

env:
  # Shared Conventional-Commit changelog generator (single source of truth in the runtime repo). Pin a
  # ref; bump this line to adopt format changes. Source: jaysuk/dwc-plugin-runtime → scripts/changelog.mjs.
  RUNTIME_REF: d077f81a11bb5af9a35fe39f7b82d789eab19896

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ github.event.inputs.dwc-ref || 'v3.7-dev' }}
          path: DuetWebControl

      - name: Capture DuetWebControl build info
        id: dwc
        run: |
          echo "version=$(node -p "require('./DuetWebControl/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C DuetWebControl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.dwc-ref || 'v3.7-dev' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with: { node-version: 24 }

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          VER=$(node -p "require('./plugin.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag '$TAG' != plugin.json version '$VER'. Bump plugin.json + package.json and re-tag."
            exit 1
          fi

      - name: Install DuetWebControl
        working-directory: DuetWebControl
        run: npm install

      - name: Install plugin (and its bundled deps into DWC)
        working-directory: plugin
        run: |
          npm install
          SPECS=$(node -p "Object.entries(require('./package.json').dependencies||{}).map(([k,v])=>/[:\\/]/.test(v)?v:k+'@'+v).join(' ')")
          if [ -n "$SPECS" ]; then (cd ../DuetWebControl && npm install --no-save $SPECS); fi

      - name: Type-check against DWC
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run typecheck

      - name: Build installable ZIP
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run verify-build

      # ── DWC 3.6 package ──────────────────────────────────────────────────────
      # A second, separate ZIP: 3.6 is Vue 2.7 / Vuetify 2 / Vuex, so it is a different bundle built
      # from src/ui36 against a different checkout. Both ship in the same release; the update checker
      # picks the right one per generation (see each ui*/host.ts assetPattern). Guarded on src/ui36
      # existing — it doesn't yet (see docs/PLAN-dwc36-backport.md Phase 3) — so this release pipeline
      # keeps working unattended in the meantime and picks the 3.6 package up automatically once it does.
      - name: Check for DWC 3.6 UI
        id: has36
        working-directory: plugin
        run: echo "present=$( [ -d src/ui36 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Checkout DuetWebControl 3.6
        if: steps.has36.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ github.event.inputs.dwc36-ref || 'v3.6-dev' }}
          path: DuetWebControl36

      - name: Install DuetWebControl 3.6
        if: steps.has36.outputs.present == 'true'
        working-directory: DuetWebControl36
        run: npm install

      # No dependency install into the 3.6 checkout: stage-dwc36.mjs vendors chart.js and
      # dwc-plugin-runtime (plus their closure) into the staged tree instead, because DWC 3.6 ships
      # chart.js 2.9 and installing v4 over it would break DWC's own graphs.
      - name: Build installable ZIP (DWC 3.6)
        if: steps.has36.outputs.present == 'true'
        working-directory: plugin
        run: |
          node scripts/stage-dwc36.mjs "$RUNNER_TEMP/clt-dwc36"
          (cd ../DuetWebControl36 && npm run build-plugin-pkg -- "$RUNNER_TEMP/clt-dwc36")
          ZIP=$(ls ../DuetWebControl36/dist/ClosedLoopTuning-*.zip | head -1)
          if [ -z "$ZIP" ]; then echo "::error::DWC 3.6 build produced no ZIP"; exit 1; fi
          mv "$ZIP" "./$(basename "${ZIP%.zip}")-dwc36.zip"
          ls -la ClosedLoopTuning-*.zip

      - name: Fetch shared release-notes generator
        if: startsWith(github.ref, 'refs/tags/')
        run: curl -fsSL "https://raw.githubusercontent.com/jaysuk/dwc-plugin-runtime/${RUNTIME_REF}/scripts/changelog.mjs" -o "$RUNNER_TEMP/changelog.mjs"

      - name: Generate release notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        env:
          DWC_VERSION: ${{ steps.dwc.outputs.version }}
          DWC_SHA: ${{ steps.dwc.outputs.sha }}
          DWC_REF: ${{ steps.dwc.outputs.ref }}
        run: |
          {
            echo 'body<<__CHANGELOG_EOF__'
            node "$RUNNER_TEMP/changelog.mjs"
            echo
            node scripts/release-footer.mjs
            echo
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release title
        id: title
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          {
            echo 'name<<__TITLE_EOF__'
            node scripts/release-title.mjs
            echo
            echo '__TITLE_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release with the ZIP (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: ${{ steps.title.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          files: plugin/ClosedLoopTuning-*.zip

      - name: Upload ZIP as an artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ClosedLoopTuning-plugin
          path: plugin/ClosedLoopTuning-*.zip
